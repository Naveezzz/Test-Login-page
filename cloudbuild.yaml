steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/trainee-sandbox/flask-app-repo/flask-auth-app:$BUILD_ID'
      - '-f'
      - 'flask-auth-app/Dockerfile'
      - 'flask-auth-app'

  # Step 2: Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/trainee-sandbox/flask-app-repo/flask-auth-app:$BUILD_ID'

  # Step 3: Deploy to Cloud Run (access is controlled by IAP, not public)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'flask-auth-service'
      - '--image'
      - 'asia-south1-docker.pkg.dev/trainee-sandbox/flask-app-repo/flask-auth-app:$BUILD_ID'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--port'
      - '8080'
      - '--quiet'
      - '--update-env-vars'
      - 'COOKIE_SECURE=1'
      - '--update-secrets'
      - 'SECRET_KEY=flask-secret-key:latest'

images:
  - 'asia-south1-docker.pkg.dev/trainee-sandbox/flask-app-repo/flask-auth-app:$BUILD_ID'

options:
  logging: CLOUD_LOGGING_ONLY
