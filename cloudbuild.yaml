
steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/trainee-sandbox/flask-app-repo/flask-auth-app:$SHORT_SHA'
      - '-f'
      - 'flask-auth-app/Dockerfile'
      - 'flask-auth-app'

  # Step 2: Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/trainee-sandbox/flask-app-repo/flask-auth-app:$SHORT_SHA'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'flask-auth-service'
      - '--image'
      - 'asia-south1-docker.pkg.dev/trainee-sandbox/flask-app-repo/flask-auth-app:$SHORT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--port'
      - '8080'
      - '--quiet'
      - '--allow-unauthenticated'

images:
  - 'asia-south1-docker.pkg.dev/trainee-sandbox/flask-app-repo/flask-auth-app:$SHORT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY

